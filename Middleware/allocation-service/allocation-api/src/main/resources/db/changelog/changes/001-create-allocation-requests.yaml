databaseChangeLog:
  - changeSet:
      id: 001-create-allocation-requests
      author: epaa
      preConditions:
        - onFail: MARK_RAN
        - not:
            - tableExists:
                tableName: allocation_requests
      changes:
        - createTable:
            tableName: allocation_requests
            columns:
              - column: { name: id, type: VARCHAR(36), constraints: { primaryKey: true, nullable: false } }
              - column: { name: created_at, type: TIMESTAMP WITH TIME ZONE, constraints: { nullable: false } }
              - column: { name: project_id, type: VARCHAR(36), constraints: { nullable: false } }
              - column: { name: agent_run_id, type: VARCHAR(36) }
              - column: { name: status, type: VARCHAR(30) }
              - column: { name: allocation_time_ms, type: INT }
              - column: { name: error, type: CLOB }
        - createIndex:
            tableName: allocation_requests
            indexName: ix_allocation_requests_project_id
            columns:
              - column: { name: project_id }
