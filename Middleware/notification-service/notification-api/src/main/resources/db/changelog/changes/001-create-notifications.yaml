databaseChangeLog:
  - changeSet:
      id: 001-create-notifications
      author: epaa
      preConditions:
        - onFail: MARK_RAN
        - not:
            - tableExists:
                tableName: notifications
      changes:
        - createTable:
            tableName: notifications
            columns:
              - column: { name: id, type: VARCHAR(36), constraints: { primaryKey: true, nullable: false } }
              - column: { name: created_at, type: TIMESTAMP WITH TIME ZONE, constraints: { nullable: false } }
              - column: { name: employee_id, type: VARCHAR(36), constraints: { nullable: false } }
              - column: { name: allocation_id, type: VARCHAR(36) }
              - column: { name: channel, type: VARCHAR(30) }
              - column: { name: subject, type: VARCHAR(200) }
              - column: { name: body, type: CLOB }
              - column: { name: status, type: VARCHAR(30) }
        - createIndex:
            tableName: notifications
            indexName: ix_notifications_status
            columns:
              - column: { name: status }
