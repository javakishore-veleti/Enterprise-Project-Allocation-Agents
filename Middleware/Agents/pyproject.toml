[project]
name = "epaa-agents"
version = "0.1.0"
description = "EPAA Agents — the 6 MCP-AI autonomous agents (Strands + Bedrock) + FastAPI orchestrator"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0",
    "psycopg2-binary>=2.9",
    "pgvector>=0.3",
    "boto3>=1.35",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "httpx>=0.27",
    # Shared data layer (models, db session, embeddings). Installed from the
    # monorepo path alongside this package (see Dockerfile / README).
    "epaa-datalake",
]

[project.optional-dependencies]
# Strands is the primary agent framework; optional so the package installs and
# the deterministic/offline path runs without network. Install for real LLM use.
strands = ["strands-agents>=0.1"]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
epaa-agents = "epaa.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
