# project-service — H2 by default; application-local-secrets.yaml (generated from
# .env) is imported when present and can switch the datasource to Postgres.
spring:
  application:
    name: project-service
  config:
    import: "optional:classpath:application-local-secrets.yaml"
  datasource:
    url: jdbc:h2:mem:epaa_project;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    username: sa
    password: ""
  h2:
    console:
      enabled: true
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml

server:
  port: ${PROJECT_SERVICE_PORT:8082}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus

springdoc:
  swagger-ui:
    path: /swagger-ui.html
