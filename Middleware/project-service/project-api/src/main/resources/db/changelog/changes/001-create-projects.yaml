databaseChangeLog:
  - changeSet:
      id: 001-create-projects
      author: epaa
      preConditions:
        - onFail: MARK_RAN
        - not:
            - tableExists:
                tableName: projects
      changes:
        - createTable:
            tableName: projects
            columns:
              - column: { name: id, type: VARCHAR(36), constraints: { primaryKey: true, nullable: false } }
              - column: { name: created_at, type: TIMESTAMP WITH TIME ZONE, constraints: { nullable: false } }
              - column: { name: name, type: VARCHAR(200), constraints: { nullable: false } }
              - column: { name: client_name, type: VARCHAR(160) }
              - column: { name: priority, type: VARCHAR(20) }
              - column: { name: complexity, type: VARCHAR(20) }
              - column: { name: duration_weeks, type: INT }
              - column: { name: required_headcount, type: INT }
              - column: { name: start_date, type: DATE }
              - column: { name: status, type: VARCHAR(30) }
  - changeSet:
      id: 002-create-project-briefs
      author: epaa
      preConditions:
        - onFail: MARK_RAN
        - not:
            - tableExists:
                tableName: project_briefs
      changes:
        - createTable:
            tableName: project_briefs
            columns:
              - column: { name: id, type: VARCHAR(36), constraints: { primaryKey: true, nullable: false } }
              - column: { name: created_at, type: TIMESTAMP WITH TIME ZONE, constraints: { nullable: false } }
              - column: { name: project_id, type: VARCHAR(36), constraints: { nullable: false } }
              - column: { name: brief_text, type: CLOB }
        - createIndex:
            tableName: project_briefs
            indexName: ix_project_briefs_project_id
            columns:
              - column: { name: project_id }
