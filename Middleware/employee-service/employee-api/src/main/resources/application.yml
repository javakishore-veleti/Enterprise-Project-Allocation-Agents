# employee-service — defaults to H2 (no Postgres needed). The git-ignored
# application-local-secrets.yaml (generated from .env by `npm run secrets:gen`)
# is imported when present and can switch the datasource to Postgres.
spring:
  application:
    name: employee-service
  config:
    import: "optional:classpath:application-local-secrets.yaml"
  datasource:
    url: jdbc:h2:mem:epaa_employee;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    username: sa
    password: ""
  h2:
    console:
      enabled: true
  jpa:
    hibernate:
      ddl-auto: none          # Liquibase owns the schema
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml

server:
  port: ${EMPLOYEE_SERVICE_PORT:8081}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus

springdoc:
  swagger-ui:
    path: /swagger-ui.html
