databaseChangeLog:
  - changeSet:
      id: 001-create-employees
      author: epaa
      preConditions:
        - onFail: MARK_RAN
        - not:
            - tableExists:
                tableName: employees
      changes:
        - createTable:
            tableName: employees
            columns:
              - column: { name: id, type: VARCHAR(36), constraints: { primaryKey: true, nullable: false } }
              - column: { name: created_at, type: TIMESTAMP WITH TIME ZONE, constraints: { nullable: false } }
              - column: { name: full_name, type: VARCHAR(160), constraints: { nullable: false } }
              - column: { name: title, type: VARCHAR(120) }
              - column: { name: seniority, type: VARCHAR(40) }
              - column: { name: years_experience, type: INT }
              - column: { name: performance_score, type: DOUBLE }
              - column: { name: availability_state, type: VARCHAR(40) }
              - column: { name: capacity_hours_per_week, type: INT }
              - column: { name: profile_text, type: CLOB }
        - createIndex:
            tableName: employees
            indexName: ix_employees_availability_state
            columns:
              - column: { name: availability_state }
