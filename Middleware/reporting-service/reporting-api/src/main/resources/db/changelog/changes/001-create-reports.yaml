databaseChangeLog:
  - changeSet:
      id: 001-create-reports
      author: epaa
      preConditions:
        - onFail: MARK_RAN
        - not:
            - tableExists:
                tableName: reports
      changes:
        - createTable:
            tableName: reports
            columns:
              - column: { name: id, type: VARCHAR(36), constraints: { primaryKey: true, nullable: false } }
              - column: { name: created_at, type: TIMESTAMP WITH TIME ZONE, constraints: { nullable: false } }
              - column: { name: project_id, type: VARCHAR(36), constraints: { nullable: false } }
              - column: { name: run_id, type: VARCHAR(36) }
              - column: { name: summary_text, type: CLOB }
              - column: { name: metrics_json, type: CLOB }
        - createIndex:
            tableName: reports
            indexName: ix_reports_project_id
            columns:
              - column: { name: project_id }
