apiVersion: 1

# Dashboard JSON files are loaded from the `json/` subfolder. The real
# dashboard for the paper's 4 evaluation metrics lands in M6.
providers:
  - name: EPAA
    folder: EPAA
    type: file
    disableDeletion: false
    allowUiUpdates: true
    options:
      path: /etc/grafana/provisioning/dashboards/json
      foldersFromFilesStructure: true
