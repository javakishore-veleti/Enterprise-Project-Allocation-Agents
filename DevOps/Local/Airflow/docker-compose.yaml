name: epaa-airflow

# Apache Airflow (LocalExecutor) — runtime for the Datalake synthetic-data DAG.
# Reuses your local apache/airflow:2.10.0-python3.12 image (pull_policy: missing).
# Its metadata DB reuses the pgvector/pgvector:pg16 image you already have (no
# new pull) but in a separate container/volume, isolated from the app DB.
# DAGs are bind-mounted from Middleware/Datalake/DAGS (filled in M2).

x-airflow-common: &airflow-common
  image: apache/airflow:2.10.0-python3.12
  pull_policy: missing
  environment: &airflow-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@epaa-airflow-db:5432/airflow
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__API__AUTH_BACKENDS: "airflow.api.auth.backend.session,airflow.api.auth.backend.basic_auth"
    AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "true"
    # Make the epaa_datalake source (mounted below) importable by the DAG tasks.
    PYTHONPATH: /opt/airflow/epaa_src
    # Airflow 2.10 pins SQLAlchemy 1.4, but the generators need SQLAlchemy 2.0.
    # Installing 2.0 into Airflow core breaks it (MappedAnnotationError), so we DON'T
    # install the generator deps here — the DAG runs generation in an isolated
    # virtualenv (@task.virtualenv, cached under /tmp). Core only needs `virtualenv`.
    _PIP_ADDITIONAL_REQUIREMENTS: "virtualenv"
    # App DB the DAG writes synthetic data into (read by epaa_datalake.config).
    POSTGRES_HOST: epaa-postgres
    POSTGRES_PORT: "5432"
    POSTGRES_DB: ${POSTGRES_DB:-epaa}
    POSTGRES_USER: ${POSTGRES_USER:-epaa}
    POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-epaa_local}
    EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-hash}
    EMBEDDING_DIM: ${EMBEDDING_DIM:-1024}
    AWS_REGION: ${AWS_REGION:-us-east-1}
  volumes:
    - ../../../Middleware/Datalake/DAGS:/opt/airflow/dags
    - ../../../Middleware/Datalake/SyntheticDataAPI/src:/opt/airflow/epaa_src
    - epaa-airflow-logs:/opt/airflow/logs
  networks:
    - epaa-net

services:
  airflow-db:
    image: pgvector/pgvector:pg16
    pull_policy: missing
    container_name: epaa-airflow-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - epaa-airflow-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - epaa-net

  airflow-init:
    <<: *airflow-common
    container_name: epaa-airflow-init
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db migrate
        airflow users create \
          --username "${AIRFLOW_ADMIN_USER:-admin}" \
          --password "${AIRFLOW_ADMIN_PASSWORD:-admin}" \
          --firstname Admin --lastname User --role Admin \
          --email admin@epaa.local || true
    restart: on-failure
    depends_on:
      airflow-db:
        condition: service_healthy

  airflow-webserver:
    <<: *airflow-common
    container_name: epaa-airflow-webserver
    command: webserver
    ports:
      - "${AIRFLOW_PORT:-8088}:8080"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -s -f http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    <<: *airflow-common
    container_name: epaa-airflow-scheduler
    command: scheduler
    restart: unless-stopped
    depends_on:
      airflow-init:
        condition: service_completed_successfully

volumes:
  epaa-airflow-db-data:
  epaa-airflow-logs:

networks:
  epaa-net:
    external: true
    name: epaa-net
