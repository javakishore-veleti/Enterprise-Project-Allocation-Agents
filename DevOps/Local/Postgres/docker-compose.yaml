name: epaa-postgres

# Postgres 16 with the pgvector extension pre-installed (Skill-Matching Agent
# stores employee/requirement embeddings here). Use any local Postgres client
# (psql, pgAdmin, DBeaver) against localhost:5432 — no UI container is shipped.

services:
  postgres:
    image: pgvector/pgvector:pg16
    pull_policy: missing        # reuse the local pg16 image; never re-pull
    container_name: epaa-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-epaa}
      POSTGRES_USER: ${POSTGRES_USER:-epaa}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-epaa_local}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - epaa-pgdata:/var/lib/postgresql/data
      - ./init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-epaa} -d ${POSTGRES_DB:-epaa}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - epaa-net

volumes:
  epaa-pgdata:

networks:
  epaa-net:
    external: true
    name: epaa-net
