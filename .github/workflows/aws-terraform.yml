name: AWS Terraform (reusable)

# Reusable workflow: runs terraform apply/destroy against the dev environment,
# targeting one or more modules. Auth via GitHub OIDC (no static AWS keys).
on:
  workflow_call:
    inputs:
      action:
        description: "apply or destroy"
        required: true
        type: string
      targets:
        description: "space-separated -target module addresses"
        required: true
        type: string
      label:
        description: "human label for logs"
        required: true
        type: string

permissions:
  id-token: write
  contents: read

jobs:
  terraform:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: DevOps/AWS/Terraform/environments/dev
    env:
      TF_VAR_db_password: ${{ secrets.EPAA_DB_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.13.4"

      - name: Terraform init
        run: |
          terraform init \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="key=epaa/dev/terraform.tfstate" \
            -backend-config="region=us-east-1" \
            -backend-config="dynamodb_table=${{ secrets.TF_LOCK_TABLE }}"

      - name: Terraform ${{ inputs.action }} — ${{ inputs.label }}
        run: |
          targets=""
          for t in ${{ inputs.targets }}; do targets="$targets -target=$t"; done
          terraform ${{ inputs.action }} -auto-approve $targets
