name: ci-middleware

# Manual-only — run from the Actions tab (no automatic push/PR triggers).
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - employee-service
          - project-service
          - allocation-service
          - notification-service
          - reporting-service
          - api-gateway
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build ${{ matrix.service }}
        run: mvn -B -ntp -DskipTests package -f Middleware/${{ matrix.service }}/pom.xml
